defaults:
  - dataset: h2o
  - clip: clip
  - diffusion: diffusion
  - mpnet: mpnet
  - seq_cvae: seq_cvae
  - pointfeat: pointfeat
  - contact: contact
  - texthom: texthom
  - refiner: refiner
project_name: "texthom"
batch_size: 64 # 64, 512
# Gradient accumulation for small GPUs: optimizer steps every accum_steps batches, so the
# effective batch is batch_size * accum_steps (e.g. batch_size=8 accum_steps=8 on an 8 GB GPU).
# Used by train/train_texthom.py. 1 keeps the original behavior.
accum_steps: 1
shuffle: True
drop_last: True
num_workers: 4
result_show_freq: 500
save_pth_freq: 2000
text: ["Place cappuccino with right hand."]
save_demo: False
save_obj: False
balance_weights: True
fps: 30

hydra:
  run:
    dir: outputs/${texthom.model_name}/
  # output_subdir: null